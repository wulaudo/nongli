<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农历显示</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: transparent;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        #lunar {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            /* 底部阴影：向下偏移 4px，模糊 8px */
            text-shadow: 0 4px 8px rgba(0,0,0,0.6);
            background: transparent;
            padding: 1rem 2rem;
        }
    </style>
</head>
<body>
    <div id="lunar">加载中…</div>

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
    <script>
        function showLunar() {
            try {
                var now = new Date();
                var solar = Solar.fromDate(now);
                var lunar = solar.getLunar();

                var yearText = lunar.getYearInGanZhi();
                var monthText = lunar.getMonthInChinese();
                var dayText = lunar.getDayInChinese();

                var festivals = lunar.getFestivals();

                var text;
                if (festivals.length > 0) {
                    text = yearText + "年 " + festivals[0];
                } else {
                    var prefix = "";
                    if (lunar.getMonth() < 0) {
                        prefix = "闰";
                    }
                    text = yearText + "年 " + prefix + monthText + "月" + dayText;
                }

                document.getElementById('lunar').textContent = text;
            } catch (e) {
                document.getElementById('lunar').textContent = "出错了";
                console.error("农历计算失败：", e);
            }
        }

        showLunar();
        setInterval(showLunar, 60000);
    </script>
</body>
</html>
